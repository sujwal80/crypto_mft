# ==============================================================================
# Docker Compose: Indian Intraday System Orchestrator
# ==============================================================================

version: '3.8'

services:
  gex-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indian_intraday_bot
    restart: always
    
    # Bind local environment profile file securely
    env_file:
      - .env
      
    # Mount host folders dynamically:
    # Preserves recorded raw ticks and backtest CSV files on the AWS SSD
    volumes:
      - ./datasets:/app/datasets
      
    # Limit console log sizes to prevent AWS SSD disk space exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
