version: '3.8'

services:
  crypto-swing-trader:
    build:
      context: ..
      dockerfile: crypto_swing_trading/Dockerfile
    container_name: crypto_swing_trader
    restart: always
    env_file:
      - ../.env
    environment:
      - TRADING_MODE=${TRADING_MODE:-SHADOW}
      - SYMBOL=${SYMBOL:-BTCUSDT}
      - REPORT_PATH=/app/reports/live_paper_trading_report.json
      - SHADOW_REPORT_PATH=/app/reports/shadow_paper_trading_report.json
    volumes:
      # Bind directories to persist logs and reports on the host parent system
      - ../logs:/app/logs
      - ../reports:/app/reports
      # Bind output files directly to the workspace root for immediate visibility
      - ../gex_micro_system.log:/app/gex_micro_system.log
      - ../shadow_paper_trading.log:/app/shadow_paper_trading.log
